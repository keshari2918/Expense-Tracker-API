spring.application.name=expense-tracker

# Default: in-memory H2 (zero setup). Use the "prod" profile for MySQL.
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT: secret must be at least 32 characters. Override with the JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
app.jwt.expiration-ms=86400000
